# Example consumer pipeline: gate a production deployment on AccessFlow approval (AF-694).
# The `accessflow` variable group holds the secret variable `accessflow-api-key`.

trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: accessflow

resources:
  repositories:
    - repository: accessflow
      type: github
      name: bablsoft/accessflow
      endpoint: github-connection

steps:
  - template: ci-templates/azure/accessflow-deployment.yml@accessflow
    parameters:
      accessflowUrl: "https://accessflow.example.com"
      pipelineId: "3fa85f64-5717-4562-b3fc-2c963f66afa6" # pipeline UUID (admin page / Terraform output)
      version: "$(Build.SourceBranchName)"
      environment: "production"
      waitTimeout: "30m"
      pollInterval: "15s"
      deploySteps:
        - script: echo "deploying $(Build.SourceBranchName) (request $(accessflowRequestId))…"
          displayName: Deploy
