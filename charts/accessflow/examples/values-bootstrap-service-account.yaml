# Declare a CI / IaC service account and its API key in bootstrap (AF-452, epic #867).
#
# A service account is a non-human identity that can never sign in interactively
# (no password, no SSO) and authenticates with API keys only. Most accounts are
# simpler to create on the admin UI's Service accounts page, where keys are issued
# once, rotated with a grace window and revoked instantly. Declare one here when
# it must exist before anyone signs in — e.g. the Terraform identity that
# provisions everything else. See docs/22-service-accounts.md.
#
# The raw key is supplied from a Secret — only its SHA-256 hash is persisted —
# and is re-imported in place whenever this spec changes.
#
#   * role: ALWAYS set it. Omitted, it defaults to ADMIN. role / displayName are
#     re-applied to an existing account whenever this spec changes, so narrowing
#     the role here and restarting narrows the account. Give it only what it
#     needs: READONLY for a deployment-gate bot (the pipeline's can_trigger grant
#     is what lets it trigger), a custom role with the right *_MANAGE permissions
#     for Terraform, ADMIN only if Terraform owns everything. The spec can name
#     only a system role: assign a custom role through PUT /api/v1/admin/users/{id}
#     and the reconciler keeps it on every later restart.
#   * Ownership: the display name and role come from this spec (the UI refuses to
#     change them); description, owner, MCP tool allow-list, rate limits and
#     on-behalf-of grants stay editable in the UI and survive every restart.
#   * The declared key can be neither revoked nor rotated from the UI — the next
#     changed reconcile would re-import it. Rotate it by changing the Secret and
#     restarting; retire it by removing/renaming it here, or deactivate the account.
#
# Pre-create this Secret in the release namespace (the value is the af_-prefixed
# token your pipeline / Terraform will send as `Authorization: ApiKey <token>`):
#   kubectl create secret generic accessflow-bootstrap-secrets \
#     --from-literal=admin-password="$(openssl rand -base64 24)" \
#     --from-literal=ci-api-key="af_$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
#
# Layer on top of a deployment-shape example:
#   helm install accessflow accessflow/accessflow \
#     --namespace accessflow --create-namespace \
#     -f charts/accessflow/examples/values-production.yaml \
#     -f charts/accessflow/examples/values-bootstrap-service-account.yaml

bootstrap:
  enabled: true

  organization:
    name: Acme Corp

  admin:
    email: admin@acme.example.com
    displayName: Acme Admin
    passwordSecretRef:
      name: accessflow-bootstrap-secrets
      key: admin-password

  serviceAccounts:
    - email: terraform@acme.example.com
      displayName: Terraform CI
      # Terraform here manages datasources, review plans and policies, which needs
      # admin-level permissions; narrow it (a custom role or READONLY) for any
      # account that does less.
      role: ADMIN
      apiKeyName: terraform
      apiKeySecretRef:
        name: accessflow-bootstrap-secrets
        key: ci-api-key
      # Optional ISO-8601 instant; never expires when omitted.
      # apiKeyExpiresAt: "2027-01-01T00:00:00Z"
