# The sample MongoDB the demo's "MongoDb" datasource queries (host mongodb, user root). Installed as its
# own Helm release next to accessflow:
#   helm upgrade --install mongodb oci://registry-1.docker.io/bitnamicharts/mongodb --version 19.1.10 \
#     --namespace accessflow -f deploy/demo/mongodb-values.yaml
# The passwords are in the sealed Secret mongodb-auth (base/sealed/mongodb-auth.yaml).
architecture: standalone
auth:
  enabled: true
  rootUser: root
  usernames:
    - accessflow
  databases:
    - accessflow
  existingSecret: mongodb-auth
image:
  digest: sha256:82a5d670c3cf9fb96e63ec413b6934537aa303a2c1c676a93ff13d772d7451a0
persistence:
  enabled: true
  size: 8Gi
resourcesPreset: small
