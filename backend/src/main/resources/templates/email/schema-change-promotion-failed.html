<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{notification.email.schema_change_promotion_failed.title}">Schema change failed</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
        pre { background: #f7fafc; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
        .meta { color: #4a5568; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; background: #c53030; color: #fff; text-decoration: none; border-radius: 4px; }
        .failure-banner { padding: 10px 12px; border-left: 3px solid #c53030; background: #fff5f5; color: #742a2a; }
    </style>
</head>
<body>
    <h2 th:text="#{notification.email.schema_change_promotion_failed.heading}">Your schema change failed</h2>
    <p class="failure-banner" th:if="${schemaChangeStatus == 'PARTIALLY_APPLIED'}"
       th:text="#{notification.email.schema_change_promotion_failed.body_partial}">
        A statement failed after earlier statements had already run.
    </p>
    <p class="failure-banner" th:unless="${schemaChangeStatus == 'PARTIALLY_APPLIED'}"
       th:text="#{notification.email.schema_change_promotion_failed.body_failed}">
        A statement failed and none of the statements were applied.
    </p>
    <p class="meta">
        <strong th:text="#{notification.email.schema_change.change_set_label}">Change set:</strong>
        <span th:text="${schemaChangeSetName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.schema_change.pipeline_label}">Pipeline:</strong>
        <span th:text="${datasourceName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.schema_change.environment_label}">Environment:</strong>
        <span th:text="${environmentName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.schema_change.promoter_label}">Promoted by:</strong>
        <span th:text="${submitterDisplayName ?: (submitterEmail ?: '—')}">—</span><br>
        <strong th:text="#{notification.email.schema_change.status_label}">Status:</strong>
        <span th:text="${schemaChangeStatus} ?: '—'">—</span>
    </p>
    <div th:if="${schemaChangeErrorMessage}">
        <strong th:text="#{notification.email.schema_change.error_label}">Error:</strong>
        <pre th:text="${schemaChangeErrorMessage}">error</pre>
    </div>
    <p th:if="${reviewUrl}">
        <a class="btn" th:href="${reviewUrl}" th:text="#{notification.email.common.open_cta}">Open in AccessFlow</a>
    </p>
</body>
</html>
