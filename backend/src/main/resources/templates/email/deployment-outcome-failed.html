<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{notification.email.deployment_outcome_failed.title}">Deployment failed</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
        pre { background: #f7fafc; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
        .meta { color: #4a5568; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; background: #c53030; color: #fff; text-decoration: none; border-radius: 4px; }
        .failure-banner { padding: 10px 12px; border-left: 3px solid #c53030; background: #fff5f5; color: #742a2a; }
    </style>
</head>
<body>
    <h2 th:text="#{notification.email.deployment_outcome_failed.heading}">A deployment you approved went wrong</h2>
    <p class="failure-banner" th:if="${deploymentOutcome == 'FAILED'}"
       th:text="#{notification.email.deployment_outcome_failed.body_failed}">
        The pipeline reported the deployment as failed.
    </p>
    <p class="failure-banner" th:if="${deploymentOutcome == 'ROLLED_BACK'}"
       th:text="#{notification.email.deployment_outcome_failed.body_rolled_back}">
        The pipeline reported the deployment as rolled back.
    </p>
    <p class="meta">
        <strong th:text="#{notification.email.deployment.pipeline_label}">Pipeline:</strong>
        <span th:text="${datasourceName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.environment_label}">Environment:</strong>
        <span th:text="${environmentName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.version_label}">Version:</strong>
        <span th:text="${deploymentVersion} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.outcome_label}">Reported outcome:</strong>
        <span th:text="${deploymentOutcome} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.submitter_label}">Submitted by:</strong>
        <span th:text="${submitterDisplayName ?: (submitterEmail ?: '—')}">—</span>
    </p>
    <p th:if="${reviewUrl}">
        <a class="btn" th:href="${reviewUrl}" th:text="#{notification.email.common.open_cta}">Open in AccessFlow</a>
    </p>
</body>
</html>
