<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{notification.email.api_connector_drift.title}">API connector schema drift</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
        .meta { color: #4a5568; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; background: #2b6cb0; color: #fff; text-decoration: none; border-radius: 4px; }
        .alert-banner { padding: 10px 12px; border-left: 3px solid #2b6cb0; background: #ebf8ff; color: #2a4365; }
    </style>
</head>
<body>
    <h2 th:text="#{notification.email.api_connector_drift.heading}">An API connector's schema changed</h2>
    <p class="alert-banner" th:text="#{notification.email.api_connector_drift.body}">
        A schema refresh found differences between the connector's stored schema and the upstream document. Review the new revision before governed calls rely on it.
    </p>
    <p class="meta">
        <strong th:text="#{notification.email.api_connector_drift.connector_label}">Connector:</strong>
        <span th:text="${datasourceName} ?: '—'">—</span>
    </p>
    <p class="meta" th:if="${reviewerComment}">
        <strong th:text="#{notification.email.api_connector_drift.detail_label}">Drift findings:</strong>
        <span th:text="${reviewerComment}">—</span>
    </p>
    <p>
        <a class="btn" th:href="${reviewUrl}" th:text="#{notification.email.api_connector_drift.cta}">Review the drift</a>
    </p>
</body>
</html>
