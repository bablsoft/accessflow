<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{notification.email.deployment_pending_review.title}">Deployment awaiting review</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
        pre { background: #f7fafc; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
        .meta { color: #4a5568; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; background: #2b6cb0; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2 th:text="#{notification.email.deployment_pending_review.heading}">A deployment is awaiting your review</h2>
    <p th:text="#{notification.email.deployment_pending_review.body}">
        A deployment has been submitted and needs approval before the pipeline can release it.
    </p>
    <p class="meta">
        <strong th:text="#{notification.email.deployment.pipeline_label}">Pipeline:</strong>
        <span th:text="${datasourceName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.environment_label}">Environment:</strong>
        <span th:text="${environmentName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.version_label}">Version:</strong>
        <span th:text="${deploymentVersion} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.deployment.submitter_label}">Submitted by:</strong>
        <span th:text="${submitterDisplayName ?: (submitterEmail ?: '—')}">—</span>
    </p>
    <p th:if="${aiSummary}">
        <strong th:text="#{notification.email.deployment_pending_review.ai_summary_label}">AI summary:</strong>
    </p>
    <pre th:if="${aiSummary}" th:text="${aiSummary}"></pre>
    <p th:if="${justification}">
        <strong th:text="#{notification.email.deployment.justification_label}">Justification:</strong>
    </p>
    <pre th:if="${justification}" th:text="${justification}"></pre>
    <p th:if="${reviewUrl}">
        <a class="btn" th:href="${reviewUrl}" th:text="#{notification.email.common.open_cta}">Open in AccessFlow</a>
    </p>
</body>
</html>
