<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{notification.email.query_executed.title}">Recurring query run completed</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
        pre { background: #f7fafc; padding: 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
        .meta { color: #4a5568; font-size: 13px; }
        .failed { color: #c53030; }
        .btn { display: inline-block; padding: 8px 16px; background: #2f855a; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2 th:if="${executionStatus == null || executionStatus.name() != 'FAILED'}"
        th:text="#{notification.email.query_executed.heading}">Your recurring query ran</h2>
    <h2 class="failed" th:if="${executionStatus != null && executionStatus.name() == 'FAILED'}"
        th:text="#{notification.email.query_executed.heading_failed}">Your recurring query run failed</h2>
    <p class="meta">
        <strong th:text="#{notification.email.common.datasource_label}">Datasource:</strong>
        <span th:text="${datasourceName} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.query_executed.rows_label}">Rows:</strong>
        <span th:text="${executionRowsAffected} ?: '—'">—</span><br>
        <strong th:text="#{notification.email.query_executed.duration_label}">Duration (ms):</strong>
        <span th:text="${executionDurationMs} ?: '—'">—</span>
    </p>
    <p><strong th:text="#{notification.email.common.sql_preview_label}">SQL preview:</strong></p>
    <pre th:text="${sqlPreview}"></pre>
    <p th:if="${resultsAttached}" class="meta"
       th:text="#{notification.email.query_executed.attachment_note}">
        The query results are attached as a CSV (capped at 10,000 rows).
    </p>
    <p>
        <a class="btn" th:href="${reviewUrl}" th:text="#{notification.email.common.open_cta}">Open in AccessFlow</a>
    </p>
</body>
</html>
