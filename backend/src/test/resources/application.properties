# Test-wide defaults for the backend suite.
#
# WHY .properties AND NOT application.yml:
# Spring resolves classpath:/application.yml to the FIRST match only, and target/test-classes
# precedes target/classes. A test application.yml would therefore SHADOW src/main/resources/
# application.yml wholesale rather than merging with it. The config-data loaders are ordered
# yaml, yml, xml, properties -- properties last, so this file merges and wins on precedence.
#
# WHAT BELONGS HERE vs IN TestcontainersConfig:
# Values here are ordinary config data, so an individual test can still override them with
# @SpringBootTest(properties = ...). Values registered from TestcontainersConfig's
# @DynamicPropertySource land in DynamicValuesPropertySource and CANNOT be overridden.
# Put a value here if any test needs to override it; put it there otherwise.
#
# Every value here was previously duplicated verbatim across several test classes' own
# @DynamicPropertySource methods -- which is what destroyed the Spring test-context cache.
# See TestcontainersConfig#accessFlowTestKeys and .claude/patterns/backend-test-parity.md.

# Scheduling is off by default in tests. With the context cache working, ~90 test classes share
# one context that is never idle, so its 36 @Scheduled jobs would otherwise run continuously
# against the shared Postgres for the whole suite -- mutating rows other tests are asserting on.
# None of the jobs declare an initialDelay, so pinning cadences would not stop the startup burst.
# The few tests that exercise a job re-enable this inline.
accessflow.scheduling.enabled=false

accessflow.audit.hmac-key=abababababababababababababababababababababababababababababababab
accessflow.notifications.public-base-url=https://app.example.test

# Keep the driver cache out of the developer's home directory: application.yml defaults
# cache-dir to ${user.home}/.accessflow/drivers, which tests would otherwise write into.
# Offline keeps resolution deterministic -- only the bundled connector installs.
accessflow.drivers.cache-dir=${java.io.tmpdir}/accessflow-test-drivers
accessflow.drivers.offline=true
