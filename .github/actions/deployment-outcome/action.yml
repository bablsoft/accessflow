name: "AccessFlow — Deployment outcome"
description: >-
  Report the post-deploy outcome (SUCCEEDED / FAILED / ROLLED_BACK) of a deployment request
  gated by the deployment-gate action. Composite actions have no post-run hook, so run this as a
  separate step with `if: always()`, passing the `job.status` expression as `job-status` —
  success maps to SUCCEEDED, failure to FAILED, and a cancelled job reports nothing. Pass an
  explicit `outcome` (e.g. ROLLED_BACK) to override the mapping. A request the gate never
  released is skipped without failing the step; reporting an outcome that conflicts with one
  already recorded fails. A rate-limited report (HTTP 429) is retried honouring Retry-After
  until retry-timeout elapses.
author: AccessFlow
branding:
  icon: flag
  color: blue

inputs:
  accessflow-url:
    description: "AccessFlow base URL."
    required: true
  api-key:
    description: "AccessFlow API key (the af_-prefixed token)."
    required: true
  request-id:
    description: >-
      The deployment request UUID (the deployment-gate step's request-id output). May be empty
      when the gate step failed before submitting — the step then skips without failing.
    required: false
  job-status:
    description: "The calling job's status — pass the `job.status` workflow expression."
    required: false
  outcome:
    description: "Explicit outcome (SUCCEEDED / FAILED / ROLLED_BACK); overrides job-status."
    required: false
  detail:
    description: "Optional free-form detail recorded with the outcome (max 4000 chars)."
    required: false
  retry-timeout:
    description: >-
      How long to keep retrying a rate-limited (HTTP 429) report, honouring the server's
      Retry-After header — e.g. 90, 45s, 2m. Other failures are never retried.
    required: false
    default: "2m"

outputs:
  status:
    description: "The request status after reporting (FAILED outcomes flip EXECUTED to FAILED)."
    value: ${{ steps.outcome.outputs.status }}

runs:
  using: composite
  steps:
    - id: outcome
      shell: bash
      env:
        AF_ENDPOINT: ${{ inputs.accessflow-url }}
        AF_API_KEY: ${{ inputs.api-key }}
        AF_REQUEST_ID: ${{ inputs.request-id }}
        AF_JOB_STATUS: ${{ inputs.job-status }}
        AF_OUTCOME: ${{ inputs.outcome }}
        AF_DETAIL: ${{ inputs.detail }}
        AF_RETRY_TIMEOUT: ${{ inputs.retry-timeout }}
      run: ${{ github.action_path }}/deployment-outcome.sh
